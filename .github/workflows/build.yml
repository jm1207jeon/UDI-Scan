name: Build UDI-Scan

on:
  push:
    branches: [ main, master, feature/*, claude/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1

    - name: Generate CoreScanner Interop DLL
      run: |
        Write-Host "===== Generating CoreScanner Interop DLL ====="

        # Create lib directory
        New-Item -ItemType Directory -Force -Path "lib" | Out-Null

        # Download CoreScanner SDK
        $sdkUrl = "https://www.zebra.com/content/dam/zebra_new_ia/en-us/software/developer-tools/corescanner-driver/CoreScannerSDK_3.08.00.zip"
        $sdkZip = "$env:TEMP\CoreScannerSDK.zip"
        $sdkExtract = "$env:TEMP\CoreScannerSDK"

        Write-Host "Downloading CoreScanner SDK..."
        try {
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip -UseBasicParsing -TimeoutSec 120
          Write-Host "Downloaded CoreScanner SDK"

          # Extract SDK
          Expand-Archive -Path $sdkZip -DestinationPath $sdkExtract -Force
          Write-Host "Extracted SDK"

          # Find TLB or DLL file
          $tlbFile = Get-ChildItem -Path $sdkExtract -Recurse -Filter "CoreScanner.tlb" -ErrorAction SilentlyContinue | Select-Object -First 1
          $dllFile = Get-ChildItem -Path $sdkExtract -Recurse -Filter "CoreScanner.dll" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($tlbFile) {
            Write-Host "Found CoreScanner.tlb at: $($tlbFile.FullName)"

            # Use tlbimp.exe to generate Interop DLL
            $tlbimp = Get-ChildItem -Path "C:\Program Files (x86)\Microsoft SDKs" -Recurse -Filter "TlbImp.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

            if ($tlbimp) {
              Write-Host "Using TlbImp at: $($tlbimp.FullName)"

              # Generate Interop DLL
              $interopDll = "$PWD\lib\Interop.CoreScanner.dll"
              & $tlbimp.FullName $tlbFile.FullName /out:$interopDll /namespace:CoreScanner /silent

              if ($LASTEXITCODE -eq 0) {
                Write-Host "Successfully generated Interop.CoreScanner.dll"
              } else {
                Write-Host "TlbImp failed with exit code: $LASTEXITCODE"
              }
            } else {
              Write-Host "TlbImp.exe not found!"
            }
          } else {
            Write-Host "CoreScanner.tlb not found in SDK!"
          }
        } catch {
          Write-Host "ERROR: $_"
        }

        # Verify Interop DLL was created
        if (Test-Path "lib\Interop.CoreScanner.dll") {
          Write-Host "SUCCESS: Interop.CoreScanner.dll created"
          Get-Item "lib\Interop.CoreScanner.dll"
        } else {
          Write-Host "FATAL: Failed to create Interop.CoreScanner.dll"
          exit 1
        }
      shell: powershell

    - name: Restore NuGet packages
      run: nuget restore src/UDIScan.sln

    - name: Build solution
      run: msbuild src/UDIScan.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild /v:minimal
      continue-on-error: false

    - name: List build output
      run: |
        echo "Build completed. Checking output directory..."
        if (Test-Path "src\UDIScan.App\bin\Release\net48") {
          dir src\UDIScan.App\bin\Release\net48
        } else {
          echo "Build output directory not found!"
          exit 1
        }
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: UDIScan-Release
        path: src/UDIScan.App/bin/Release/net48/
        retention-days: 30

    - name: Create Release ZIP
      if: success()
      run: |
        cd src/UDIScan.App/bin/Release/net48
        Compress-Archive -Path * -DestinationPath ../../../../../UDIScan-Release.zip
      shell: powershell

    - name: Upload Release ZIP
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: UDIScan-Release-ZIP
        path: UDIScan-Release.zip
        retention-days: 30

  # Create a GitHub Release when a tag is pushed
  release:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: UDIScan-Release-ZIP

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: UDIScan-Release.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
